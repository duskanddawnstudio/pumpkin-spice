<title>Death by Pumpkin Spice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;600;700&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: one-column phone "case file". A lit café window in a stormy night; each step of the evening is a sealed envelope that unlocks in order. Single committed dark look. */
:root {
  --night: #1b1420;
  --panel: #2a2030;
  --panel-2: #352839;
  --line: #4a3a4d;
  --cream: #fbf4ea;
  --muted: #b9a9b6;
  --pumpkin: #e07a2e;
  --cinnamon: #a8512a;
  --gold: #d2a955;
  --display: "Gloock", Georgia, "Times New Roman", serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Instrument Serif", Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  background-image: radial-gradient(120% 60% at 70% 0%, rgba(224,122,46,.16), transparent 60%);
  background-attachment: fixed;
  color: var(--cream); font: 16px/1.55 var(--body);
  padding-inline: 18px; padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
#rain { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5; }
main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding-block: 22px 60px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
.kicker { font: 700 11px/1 var(--body); letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.hand { font-family: var(--hand); font-style: italic; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; background: var(--panel); font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { color: var(--cream); background: var(--panel-2); }

/* home hero */
.hero { text-align: center; padding-block: 18px 8px; display: grid; justify-items: center; gap: 6px; }
.hero canvas { width: 150px; height: 150px; }
.hero .hand { color: var(--pumpkin); font-size: 21px; }
.hero h1 { font-size: clamp(40px, 11vw, 58px); line-height: .98; }
.hero p { color: var(--muted); margin: 8px 0 0; max-width: 34ch; }

/* steps */
.steps { list-style: none; padding: 0; margin: 26px 0 0; display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: 14px 16px; border-radius: 16px; background: var(--panel); border: 1px solid transparent; transition: transform .15s, border-color .15s; }
.step:not([disabled]):hover { border-color: var(--line); }
.step:not([disabled]):active { transform: scale(.985); }
.step .n { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font: 20px var(--display); background: var(--panel-2); color: var(--muted); }
.step .t { min-width: 0; }
.step .t b { display: block; font: 19px/1.2 var(--display); font-weight: 400; }
.step .t span { font-size: 13px; color: var(--muted); }
.step .s { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.step.next { border-color: var(--pumpkin); background: linear-gradient(180deg, rgba(224,122,46,.14), rgba(224,122,46,.04)), var(--panel); }
.step.next .n { background: var(--pumpkin); color: var(--night); }
.step.next .s { color: var(--pumpkin); }
.step.done .n { background: transparent; border: 1px solid var(--line); color: var(--gold); }
.step[disabled] { opacity: .45; cursor: not-allowed; }
.foot { margin-top: 28px; display: flex; justify-content: center; }
.link { color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; padding: 8px; }

/* screens */
.screen-head { margin-top: 20px; display: grid; gap: 8px; }
.screen-head h2 { font-size: clamp(32px, 9vw, 44px); line-height: 1.02; }
.screen-head .hand { color: var(--pumpkin); font-size: 21px; }
.instr { margin: 16px 0 0; padding: 14px 16px; border-radius: 14px; background: var(--panel); color: var(--muted); font-size: 15px; }
.read { margin-top: 20px; display: grid; gap: 14px; font-size: 18px; line-height: 1.6; }
.read p { margin: 0; }
.read p.big { font: 26px/1.25 var(--display); color: var(--pumpkin); }

/* clue envelopes */
.clues { margin-top: 18px; display: grid; gap: 14px; }
.clue { position: relative; border-radius: 18px; overflow: hidden; background: var(--panel); }
.clue .seal { width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 18px; text-align: left;
  background: repeating-linear-gradient(135deg, var(--panel) 0 14px, var(--panel-2) 14px 28px); }
.clue .wax { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--cinnamon); color: var(--cream);
  font: 22px var(--display); box-shadow: inset 0 0 0 3px rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.35); }
.clue .seal b { font: 21px var(--display); font-weight: 400; display: block; }
.clue .seal span { font-size: 13px; color: var(--muted); }
.clue .tap { font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--gold); text-transform: uppercase; }
.clue .open { padding: 18px 18px 20px; border-top: 1px solid var(--line); display: grid; gap: 10px; animation: unfold .5s ease both; }
.clue .open h3 { font-size: 23px; }
.clue .open .src { font-family: var(--hand); font-style: italic; color: var(--muted); font-size: 17px; }
.clue .open ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 16.5px; }
@keyframes unfold { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

.ev { margin: 4px 0 0; padding: 10px 12px; border-radius: 10px; background: rgba(224,122,46,.14); color: var(--cream); font-size: 14.5px; font-weight: 600; }
.twist .wax { background: var(--pumpkin); color: var(--night); }
.clock { font: 64px/1 var(--display); color: var(--pumpkin); font-variant-numeric: tabular-nums; margin: 6px 0; }
.prop { margin: 6px 0 0; display: grid; gap: 6px; }
.prop img { width: 100%; border-radius: 12px; display: block; }
.prop figcaption { font-size: 13px; color: var(--muted); }
.links-card { margin-top: 18px; width: 100%; text-align: left; display: grid; gap: 4px; padding: 18px; border-radius: 18px;
  border: 1px dashed var(--gold); background: rgba(210,169,85,.06); }
.links-card b { font: 21px/1.2 var(--display); font-weight: 400; }
.links-card span:last-child { color: var(--muted); font-size: 14px; }
.linkrow { cursor: default; }
.linkrow .chip { white-space: nowrap; }
.copybox { width: 100%; margin-top: 12px; border-radius: 12px; background: var(--panel); color: var(--cream); border: 1px solid var(--line); padding: 12px; font: 14px var(--body); }
.tag { margin: 14px 0 0; font: italic 19px/1.4 var(--hand); color: var(--gold); }
.body { margin: 8px 0 0; font-size: 17px; }
.muted { color: var(--muted); font-size: 15px; }
.knows { margin-top: 8px; display: grid; gap: 8px; font-size: 15.5px; }
.knows p { margin: 0; }
.secretbox { margin-top: 26px; padding: 20px; border-radius: 20px; background: repeating-linear-gradient(135deg, var(--panel) 0 14px, var(--panel-2) 14px 28px); }
.secret { margin-top: 10px; padding: 16px; border-radius: 14px; background: var(--night); display: grid; gap: 10px; font-size: 16px; }
.secret p { margin: 0; }
.pround { margin-top: 16px; padding: 18px; border-radius: 18px; background: var(--panel); display: grid; gap: 10px; }
.pround ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.phead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.phead .hand { font-size: 18px; color: var(--muted); }
.pill { padding: 6px 12px; border-radius: 999px; font: 700 12px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--cream); }
.pill.r1 { background: var(--pumpkin); } .pill.r2 { background: var(--cinnamon); } .pill.r3 { background: #5a3a55; }
.lbl2 { font: 700 11px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.ask { margin: 0; font-style: italic; }
.mission { padding: 12px 14px; border-radius: 12px; background: rgba(224,122,46,.14); display: grid; gap: 4px; }
.mission p { margin: 0; font-weight: 600; }
.notes { width: 100%; margin-top: 8px; border-radius: 14px; background: var(--panel); color: var(--cream); border: 1px solid var(--line); padding: 12px; font: 16px var(--body); }
.primary { margin-top: 24px; width: 100%; padding: 17px; border-radius: 999px; background: var(--pumpkin); color: var(--night); font-weight: 700; font-size: 16px; letter-spacing: .02em; }
.primary[disabled] { background: var(--panel-2); color: var(--muted); cursor: not-allowed; }
.ghost { margin-top: 10px; width: 100%; padding: 15px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }

/* reveal */
.lockbox { margin-top: 26px; padding: 26px 20px; border-radius: 22px; background: var(--panel); text-align: center; display: grid; gap: 14px; justify-items: center; }
.hold { position: relative; width: 190px; height: 190px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none; }
.hold svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.hold .lbl { font: 22px/1.1 var(--display); padding: 0 30px; }
.hold .lbl small { display: block; font: 12px var(--body); color: var(--muted); margin-top: 6px; letter-spacing: .1em; text-transform: uppercase; }
.hold.go { animation: throb .8s ease-in-out infinite; }
@keyframes throb { 50% { transform: scale(1.04); } }
.killer { margin-top: 26px; text-align: center; display: grid; gap: 6px; }
.killer .name { font: clamp(46px, 13vw, 66px)/1 var(--display); color: var(--pumpkin); animation: slam .9s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes slam { from { opacity: 0; transform: scale(1.6); letter-spacing: .2em; } to { opacity: 1; transform: none; } }
.howlist { margin-top: 18px; display: grid; gap: 10px; counter-reset: h; }
.howlist div { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
.howlist div::before { counter-increment: h; content: counter(h); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--pumpkin); color: var(--night); font: 15px var(--display); }
.sub { margin-top: 30px; }
.herr { margin-top: 12px; display: grid; gap: 10px; font-size: 15.5px; color: var(--muted); }
.herr b { color: var(--cream); }

/* confirm sheet */
.sheet { position: fixed; inset: 0; z-index: 10; display: grid; place-items: end center; background: rgba(10,6,12,.6); padding: 18px; }
.sheet > div { width: 100%; max-width: 520px; background: var(--panel); border-radius: 22px; padding: 22px; display: grid; gap: 10px;
  margin-bottom: env(safe-area-inset-bottom, 0px); }
.sheet h3 { font-size: 24px; }
.sheet p { margin: 0; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } #rain { display: none; } }
</style>

const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
function nextIndex() { for (let i = 0; i < STEPS.length; i++) if (!state.done.includes(STEPS[i].id)) return i; return STEPS.length; }
function bar(back) {
  return `<div class="bar">${back ? `<button class="chip" data-go="home">← Case file</button>` : `<span class="kicker">The Grumpy Gourd · Hollowmere</span>`}
    <button class="chip" id="snd" aria-pressed="${state.sound}">${state.sound ? "Sound on" : "Sound off"}</button></div>`;
}
function home() {
  const ni = nextIndex();
  app.innerHTML = `${bar(false)}
  <section class="hero"><canvas id="cup" aria-hidden="true"></canvas>
    <span class="hand">a Halloween murder mystery</span><h1>Death by<br>Pumpkin Spice</h1>
    <p>The host's case file. Open each step in order. The killer stays locked until the very end, even from you.</p></section>
  <ol class="steps">${STEPS.map((s, i) => {
    const done = state.done.includes(s.id), next = i === ni, locked = i > ni;
    return `<li><button class="step ${done ? "done" : ""} ${next ? "next" : ""}" data-open="${s.id}" ${locked ? "disabled" : ""}>
      <span class="n">${done ? "✓" : i === 0 ? "•" : i <= 3 ? i : i === 4 ? "4" : i === 5 ? "?" : "!"}</span>
      <span class="t"><b>${s.title}</b><span>${s.sub}</span></span>
      <span class="s">${done ? "Done" : next ? "Open" : "Locked"}</span></button></li>`; }).join("")}</ol>
  <button class="links-card" data-go="links"><span class="kicker">Playing on phones?</span><b>Send each player their character</b>
    <span>Every guest gets a private link with their booklet, missions and sealed secret. No printing needed.</span></button>
  <div class="foot"><button class="link" id="reset">Start a new game</button></div>`;
  latte(document.getElementById("cup"));
}
function baseURL() { return location.href.split("#")[0]; }
function linkFor(k) { return baseURL() + "#" + k; }
function copyText(txt, btn) {
  const done = () => { if (btn) { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => btn.textContent = o, 1500); } };
  try { navigator.clipboard.writeText(txt).then(done, () => fallback()); } catch (e) { fallback(); }
  function fallback() { const ta = document.getElementById("copybox"); if (ta) { ta.value = txt; ta.hidden = false; ta.focus(); ta.select(); } }
}
function links() {
  const all = DATA.players;
  app.innerHTML = `${bar(true)}<header class="screen-head"><span class="kicker">Phone play</span><h2>Send each player their character</h2>
    <span class="hand">Copy a link, paste it to that guest. Don't open them yourself.</span></header>
    <p class="instr">Main cast are essential. For 7 to 12 players, add extra characters in order. Each link opens that character's private booklet on the guest's own phone.</p>
    <div class="steps" style="margin-top:16px">${all.map((p, i) => `<div class="step linkrow">
      <span class="n" style="${p.extra ? "" : "background:var(--pumpkin);color:var(--night)"}">${i + 1}</span>
      <span class="t"><b>${esc(p.name)}</b><span>${esc(p.role)}${p.extra ? " \u00b7 extra" : ""}</span></span>
      <button class="chip" data-copy="${p.key}">Copy link</button></div>`).join("")}</div>
    <textarea id="copybox" class="copybox" rows="3" hidden aria-label="Link to copy"></textarea>
    <button class="ghost" data-go="home">Back to the case file</button>`;
}
function opening() {
  app.innerHTML = `${bar(true)}<header class="screen-head"><span class="kicker">Read aloud</span><h2>The Opening Scene</h2>
    <span class="hand">Halloween night, 8:30pm. The rain is hammering down.</span></header>
    <div class="read">${DATA.opening.map(p => `<p class="${p.startsWith("Rex Pumpernickel is dead") ? "big" : ""}">${esc(p)}</p>`).join("")}</div>
    <button class="primary" data-finish="opening">Start Round 1</button>`;
  thunder();
}
function round(n) {
  const [k, t, instr] = DATA.rounds[n]; const clues = DATA.clues.filter(c => c[1] === n);
  const twistOpen = n !== 2 || state.opened.includes(0);
  const allOpen = twistOpen && clues.every(c => state.opened.includes(c[0]));
  app.innerHTML = `${bar(true)}<header class="screen-head"><span class="kicker">${k}</span><h2>${esc(t)}</h2></header>
    <p class="instr">${esc(instr)}</p>
    <div class="clues">${n === 2 ? twistHTML() : ""}${twistOpen ? clues.map(c => clueHTML(c)).join("") : `<p class="instr" style="margin:0">Open the twist first. The clue cards appear after it.</p>`}</div>
    <button class="primary" data-finish="r${n}" ${allOpen ? "" : "disabled"}>${allOpen ? (n < 3 ? `Finish round ${n}` : "Go to the Hot Seat") : "Open every envelope first"}</button>`;
}
function evid(k) { const nm = DATA.evidence[String(k)]; if (!nm) return "";
  return `<figure class="prop"><img src="${IMG[String(k)]}" alt="Evidence: ${esc(nm)}"><figcaption>Evidence: ${esc(nm)}. Show it round, or pass the phone.</figcaption></figure>
    <p class="ev">Playing on paper? Open the sealed Evidence prop: ${esc(nm)}.</p>`; }
function twistHTML() {
  const [title, src, lines] = DATA.twist; const open = state.opened.includes(0);
  return `<article class="clue twist" id="clue-0">${open ? `<div class="seal" style="background:var(--panel)"><span class="wax">!</span><span><b>Twist</b><span>Opened</span></span><span></span></div>
    <div class="open"><h3>Twist: ${esc(title)}</h3><span class="src">${esc(src)}</span><ul>${lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>${evid(0)}</div>`
    : `<button class="seal" data-clue="0"><span class="wax">!</span><span><b>Twist!</b><span>Something has happened. Read it aloud.</span></span><span class="tap">Tap to open</span></button>`}</article>`;
}
function clueHTML(c) {
  const [num, , title, src, lines] = c; const open = state.opened.includes(num);
  return `<article class="clue" id="clue-${num}">${open ? `<div class="seal" style="background:var(--panel)"><span class="wax">${num}</span><span><b>Clue ${num}</b><span>Opened</span></span><span></span></div>
    <div class="open"><h3>${esc(title)}</h3><span class="src">${esc(src)}</span><ul>${lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>${evid(num)}</div>`
    : `<button class="seal" data-clue="${num}"><span class="wax">${num}</span><span><b>Clue ${num}</b><span>Sealed. Read it aloud to everyone.</span></span><span class="tap">Tap to open</span></button>`}</article>`;
}
let hsTimer = null;
function hotseat() {
  const done = state.hs || [];
  app.innerHTML = `${bar(true)}<header class="screen-head"><span class="kicker">Interrogation</span><h2>The Hot Seat</h2>
    <span class="hand">Two minutes each. Make them sweat.</span></header>
    <div class="read" style="font-size:16px;gap:6px">${DATA.hotseat.map(p => `<p>${esc(p)}</p>`).join("")}</div>
    <div class="steps" style="margin-top:18px">${DATA.suspects.map(([nm, role], i) => `<button class="step ${done.includes(i) ? "done" : ""}" data-hs="${i}">
      <span class="n">${done.includes(i) ? "✓" : i + 1}</span><span class="t"><b>${esc(nm)}</b><span>${esc(role)}</span></span>
      <span class="s">${done.includes(i) ? "Again" : "2:00"}</span></button>`).join("")}</div>
    <button class="primary" data-finish="hotseat">Go to accusations</button>`;
}
function runTimer(i) {
  const [nm] = DATA.suspects[i]; let left = 120; clearInterval(hsTimer);
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<div role="dialog" aria-modal="true" aria-labelledby="ht" style="text-align:center;justify-items:center">
    <span class="kicker">In the hot seat</span><h3 id="ht" style="font-size:30px">${esc(nm)}</h3>
    <div class="clock" id="clk">2:00</div><p>Ask anything. They must answer.</p>
    <button class="primary" id="hsdone" style="margin-top:6px">Done</button></div>`;
  document.body.appendChild(el); thump(0, .6);
  const clk = el.querySelector("#clk");
  const close = () => { clearInterval(hsTimer); el.remove(); state.hs = Array.from(new Set([...(state.hs || []), i])); save(); hotseat(); };
  el.querySelector("#hsdone").onclick = close;
  hsTimer = setInterval(() => { left--; clk.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    if (left <= 10 && left > 0) thump(0, .35); if (left <= 0) { clearInterval(hsTimer); clk.textContent = "Time!"; sting(); } }, 1000);
}
function accuse() {
  app.innerHTML = `${bar(true)}<header class="screen-head"><span class="kicker">Accusations</span><h2>The police are almost here</h2>
    <span class="hand">Who killed Rex Pumpernickel?</span></header>
    <div class="read"><p>Everyone fills in an accusation slip, in secret: who did it, why, and how.</p>
    <p>No slips? Write it in your phone notes instead.</p>
    <p>Then go round the room and read the slips aloud, one by one. Defend yourselves. Point fingers. Change nothing once it's read.</p>
    <p>When every accusation has been heard, the host opens the Final Reveal.</p></div>
    <button class="primary" data-finish="accuse">Everyone has accused someone</button>`;
}
function reveal() {
  if (state.done.includes("reveal")) return revealed(false);
  app.innerHTML = `${bar(true)}<header class="screen-head"><span class="kicker">Final Reveal</span><h2>Who killed Rex Pumpernickel?</h2></header>
    <div class="lockbox"><p class="hand" style="font-size:20px;margin:0;color:var(--muted)">Gather everyone round. Turn the sound up.</p>
      <button class="hold" id="hold" aria-label="Press and hold for three seconds to reveal the killer">
        <svg viewBox="0 0 190 190" aria-hidden="true"><circle cx="95" cy="95" r="88" fill="none" stroke="#4a3a4d" stroke-width="6"/>
        <circle id="ring" cx="95" cy="95" r="88" fill="none" stroke="#e07a2e" stroke-width="6" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="553"/></svg>
        <span class="lbl">Press and hold<small>3 seconds</small></span></button></div>`;
  const hold = document.getElementById("hold"), ring = document.getElementById("ring"); let start = 0, raf = 0, beat = 0;
  function frame(ts) { const p = Math.min(1, (ts - start) / 3000); ring.style.strokeDashoffset = 553 * (1 - p);
    const b = Math.floor(p * 6); if (b > beat) { beat = b; thump(0, .5 + p * .5); }
    if (p >= 1) { cancel(); finish("reveal"); return revealed(true); } raf = requestAnimationFrame(frame); }
  function begin(e) { e.preventDefault(); ac(); start = performance.now(); beat = 0; hold.classList.add("go"); raf = requestAnimationFrame(frame); }
  function cancel() { cancelAnimationFrame(raf); hold.classList.remove("go"); ring.style.strokeDashoffset = 553; }
  hold.addEventListener("pointerdown", begin); ["pointerup", "pointerleave", "pointercancel"].forEach(ev => hold.addEventListener(ev, cancel));
  hold.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !e.repeat) begin(e); });
  hold.addEventListener("keyup", cancel);
}
function revealed(fresh) {
  if (fresh) sting();
  app.innerHTML = `${bar(true)}<div class="killer"><span class="kicker">The killer is</span><span class="name">${esc(DATA.killer)}</span>
    <span class="hand" style="font-size:20px;color:var(--muted)">${esc(DATA.story[0].split(", ").slice(1).join(", ").replace(/\.$/, "") || "")}</span></div>
    <div class="read">${DATA.story.slice(1).map(p => `<p>${esc(p)}</p>`).join("")}</div>
    <section class="sub"><span class="kicker">How it could be solved</span><div class="howlist">${DATA.how.map(([a, b]) => `<div><span><b>${esc(a)}</b>, ${esc(b)}</span></div>`).join("")}</div></section>
    <section class="sub"><span class="kicker">The red herrings</span><div class="herr">${DATA.herrings.map(([a, b]) => `<p style="margin:0"><b>${esc(a)}</b> ${esc(b)}</p>`).join("")}</div></section>
    <p class="instr" style="margin-top:26px">Anyone who named ${esc(DATA.killer)} wins Super Sleuth. ${esc(DATA.killer.split(" ")[0])}, if you got away with it, you win Most Convincing Liar. Hand out the award certificates!</p>
    <button class="ghost" data-go="home">Back to the case file</button>`;
}
const PKEY = k => "dbps-player-" + k;
function pstate(k) { let s = { rounds: [], secret: false, notes: "" }; try { Object.assign(s, JSON.parse(localStorage.getItem(PKEY(k)) || "{}")); } catch (e) {} return s; }
function psave(k, s) { try { localStorage.setItem(PKEY(k), JSON.stringify(s)); } catch (e) {} }
let showSecret = false;
function player(k) {
  const p = DATA.players.find(x => x.key === k); const s = pstate(k);
  const round = n => { const r = p.rounds[n - 1]; const open = s.rounds.includes(n);
    return `<section class="pround ${open ? "open" : ""}"><div class="phead"><span class="pill r${n}">Round ${n}</span><span class="hand">${esc(DATA.rounds[n][1])}</span></div>
      ${open ? `${r.say.length ? `<span class="lbl2">${n === 1 ? "Say this" : "Reveal this"}</span><ul>${r.say.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        ${r.ask ? `<span class="lbl2">Find out</span><p class="ask">${esc(r.ask)}</p>` : ""}
        <div class="mission"><span class="lbl2">Secret mission</span><p>${esc(r.mission)}</p></div>`
      : `<button class="ghost" data-pround="${n}" style="margin-top:0">Tap when your host starts Round ${n}</button>`}</section>`; };
  app.innerHTML = `<div class="bar"><span class="kicker">Your character \u00b7 keep it private</span>
      <button class="chip" id="snd" aria-pressed="${state.sound}">${state.sound ? "Sound on" : "Sound off"}</button></div>
    <header class="screen-head"><span class="hand">Death by Pumpkin Spice</span><h2>${esc(p.name)}</h2><span class="kicker" style="color:var(--pumpkin)">${esc(p.role)}</span></header>
    ${p.tagline ? `<p class="tag">\u201c${esc(p.tagline)}\u201d</p>` : ""}
    <p class="instr"><b>Costume idea:</b> ${esc(p.costume)}</p>
    <section class="sub"><span class="kicker">Who you are</span><p class="body">${esc(p.bio)}</p></section>
    ${p.knows.length ? `<section class="sub"><span class="kicker">What you know about the others</span><div class="knows">${p.knows.map(([n, x]) => `<p><b>${esc(n)}.</b> ${esc(x)}</p>`).join("")}</div></section>` : ""}
    <section class="sub"><span class="kicker">How to play</span><p class="body muted">Stay in character. Share each round's information when your host starts that round. Keep your missions to yourself. Hide your secret if you like, but never lie about what's written here, unless your secret tells you to.</p></section>
    <div class="secretbox">${!s.secret ? `<span class="kicker">Sealed secret</span><p class="hand" style="font-size:19px;margin:6px 0 12px">Open only when your host says \u201cOpen your secrets\u201d.</p>
        <button class="primary" data-psecret="ask" style="margin-top:0">Open my secret</button>`
      : showSecret ? `<span class="kicker">Your secret \u00b7 don't show anyone</span><div class="secret">${p.secret.map((x, i) => `<p>${i === 0 && p.head ? `<b>${esc(p.head)}</b> ` : ""}${esc(x)}</p>`).join("")}</div>
        <button class="ghost" data-psecret="hide">Hide my secret</button>`
      : `<span class="kicker">Sealed secret</span><p class="body muted" style="margin:6px 0 12px">You've opened your secret. It's hidden so nobody sees it over your shoulder.</p>
        <button class="ghost" data-psecret="show" style="margin-top:0">Show my secret</button>`}</div>
    ${[1, 2, 3].map(round).join("")}
    <section class="sub"><span class="kicker">My notes</span><textarea id="pnotes" class="notes" rows="6" placeholder="Who's lying? Who was where?">${esc(s.notes)}</textarea></section>`;
  const ta = document.getElementById("pnotes"); ta.addEventListener("input", () => { const s2 = pstate(k); s2.notes = ta.value; psave(k, s2); });
}
function askSecret(k) {
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<div role="dialog" aria-modal="true" aria-labelledby="st"><h3 id="st">Has the host said \u201cOpen your secrets\u201d?</h3>
    <p>Make sure nobody can see your screen. One of you is about to find out you're the killer.</p>
    <button class="primary" id="yes" style="margin-top:8px">Open my secret</button><button class="ghost" id="no">Not yet</button></div>`;
  document.body.appendChild(el);
  el.querySelector("#no").onclick = () => el.remove();
  el.addEventListener("click", e => { if (e.target === el) el.remove(); });
  el.querySelector("#yes").onclick = () => { const s = pstate(k); s.secret = true; psave(k, s); showSecret = true; el.remove(); thump(0, .7); player(k); };
}
function finish(id) { if (!state.done.includes(id)) state.done.push(id); save(); }
function show(id) {
  state.screen = id; scrollTo(0, 0);
  clearInterval(hsTimer); ({ home, links, opening, accuse, reveal, hotseat, r1: () => round(1), r2: () => round(2), r3: () => round(3) })[id]();
}
function confirmReset() {
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<div role="dialog" aria-modal="true" aria-labelledby="rt"><h3 id="rt">Start a new game?</h3><p>This locks every clue and the reveal again, ready for a fresh party.</p>
    <button class="primary" id="yes" style="margin-top:8px">Start a new game</button><button class="ghost" id="no">Keep this game</button></div>`;
  document.body.appendChild(el);
  el.querySelector("#no").onclick = () => el.remove();
  el.addEventListener("click", e => { if (e.target === el) el.remove(); });
  el.querySelector("#yes").onclick = () => { state.done = []; state.opened = []; state.hs = []; save(); el.remove(); show("home"); };
}
app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "snd") { state.sound = !state.sound; save(); t.setAttribute("aria-pressed", state.sound); t.textContent = state.sound ? "Sound on" : "Sound off"; return; }
  if (t.id === "reset") return confirmReset();
  if (t.dataset.go) return show(t.dataset.go);
  if (t.dataset.open) { ac(); return show(t.dataset.open); }
  if (t.dataset.hs) return runTimer(+t.dataset.hs);
  if (t.dataset.copy) { const p = DATA.players.find(x => x.key === t.dataset.copy);
    return copyText(`You're invited to Death by Pumpkin Spice! \u{1F383}\nYou are ${p.name}, ${p.role}.\nTap to open your private character booklet (don't share it):\n\n${linkFor(p.key)}`, t); }
  if (t.dataset.pround) { const k = location.hash.slice(1); const s = pstate(k); const n = +t.dataset.pround; if (!s.rounds.includes(n)) s.rounds.push(n); psave(k, s); paper(); return player(k); }
  if (t.dataset.psecret) { const k = location.hash.slice(1);
    if (t.dataset.psecret === "ask") return askSecret(k);
    showSecret = t.dataset.psecret === "show"; return player(k); }
  if (t.dataset.clue) { const n = +t.dataset.clue; if (!state.opened.includes(n)) state.opened.push(n); save(); paper(); thump(.05, .4);
    const r = n === 0 ? 2 : DATA.clues.find(c => c[0] === n)[1]; round(r); if (n === 0) thunder(); document.getElementById("clue-" + n).scrollIntoView({ block: "nearest", behavior: "smooth" }); return; }
  if (t.dataset.finish) { const id = t.dataset.finish; finish(id); const i = STEPS.findIndex(s => s.id === id);
    return show(STEPS[i + 1] ? STEPS[i + 1].id : "home"); }
});
try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
function route() { const h = location.hash.slice(1); scrollTo(0, 0);
  if (DATA.players.some(p => p.key === h)) { showSecret = false; return player(h); } show("home"); }
addEventListener("hashchange", route);
route();
</script>
